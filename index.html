<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark SMP - Minecraft Server</title>

    <!-- Embed Meta Tags Corrigidas -->
    <meta property="og:title" content="Dark SMP - Minecraft Server" />
    <meta property="og:url" content="http://dark-smp.ddns.net" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ff0000"> <!-- Barra lateral vermelha no Discord -->

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Dark SMP">

    <style>
        /* Reset básico e tema escuro anti-queimar olhos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace; /* Fonte estilo terminal/Linux */
        }

        body {
            background-color: #0d0d11; /* Fundo super escuro */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Janela estilo Linux com cantos arredondados (corners) */
        .linux-window {
            width: 100%;
            max-width: 600px;
            background-color: #16161e;
            border: 2px solid #ff0000; /* Borda vermelha sutil */
            border-radius: 12px; /* Cantos arredondados */
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        /* Barra superior da janela de Linux */
        .window-bar {
            background-color: #222230;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #ff0000;
        }

        /* Botões de fechar/minimizar estilo Linux */
        .window-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .btn-close { background-color: #ff5f56; }
        .btn-minimize { background-color: #ffbd2e; }
        .btn-maximize { background-color: #27c93f; }

        .window-title {
            color: #a9b1d6;
            font-size: 14px;
            font-weight: bold;
        }

        /* Conteúdo interno da janela */
        .window-content {
            padding: 30px 20px;
            text-align: center;
        }

        /* Título Principal em Vermelho */
        .main-title {
            color: #ff0000;
            font-size: 2.2rem;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Informações do Servidor */
        .info-box {
            background-color: #0d0d11;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #333;
            text-align: left;
        }

        .info-line {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .info-line:last-child {
            margin-bottom: 0;
        }

        .label {
            color: #ff0000; /* Marcadores em vermelho */
            font-weight: bold;
        }

        .value {
            color: #e0af68; /* Valores em amarelo/laranja estilo terminal */
        }
        
        .value.not-finished {
            color: #787c99;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Estrutura da Janela Linux -->
    <div class="linux-window">
        <div class="window-bar">
            <div class="window-buttons">
                <span class="btn btn-close"></span>
                <span class="btn btn-minimize"></span>
                <span class="btn btn-maximize"></span>
            </div>
            <div class="window-title">terminal @ dark-smp</div>
            <div style="width: 50px;"></div> <!-- Alinhamento -->
        </div>

        <div class="window-content">
            <!-- Seu título vermelho -->
            <h1 class="main-title">Dark SMP - Minecraft Server</h1>

            <!-- Bloco de informações solicitadas -->
            <div class="info-box">
                <div class="info-line">
                    <span class="label">> Supported Versions: </span>
                    <span class="value">26.2 - 1.21.11</span>
                </div>
                <div class="info-line">
                    <span class="label">> Server IP: </span>
                    <span class="value not-finished">not finished</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
