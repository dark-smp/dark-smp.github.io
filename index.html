<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark SMP - Minecraft Server</title>

    <!-- Evitar cache para atualizar rápido -->
    <meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="expires" content="0" />

    <!-- Embed Meta Tags -->
    <meta property="og:title" content="Dark SMP - Minecraft Server" />
    <meta property="og:url" content="http://dark-smp.ddns.net" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ff0000">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Dark SMP">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            background-color: #06060a; 
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container ajustado para o novo tamanho ideal: X = 400px, Y = 350px */
        .container {
            width: 400px;
            height: 350px;
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            border: 1px solid rgba(255, 0, 50, 0.28);
            border-radius: 20px; /* Cantos sutilmente mais arredondados para acompanhar o tamanho */
            
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 45px 35px 40px 35px; /* Espaçamento interno mais generoso */
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.65),
                        0 0 50px rgba(255, 0, 50, 0.06);
        }

        /* Título Principal escalado para a nova proporção */
        .main-title {
            color: #ffffff;
            font-size: 2.2rem; /* Tamanho maior e impactante */
            text-align: center;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
        }

        /* Painel de Informações distribuído com o novo espaçamento */
        .info-box {
            display: flex;
            flex-direction: column;
            gap: 22px; /* Maior separação entre as linhas de dados */
        }

        .info-line {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            font-size: 15px; /* Fonte com excelente legibilidade */
            border-bottom: 1px solid rgba(255, 255, 255, 0.06); 
            padding-bottom: 12px;
        }

        .info-line:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .label {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            letter-spacing: 0.8px;
        }

        .value {
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        /* IP não finalizado com destaque limpo em vermelho */
        .value.not-finished {
            color: #ff334b;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 51, 75, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Título principal com tamanho perfeito para a nova largura -->
        <h1 class="main-title">Dark SMP</h1>

        <!-- Bloco de dados minimalista e bem distribuído -->
        <div class="info-box">
            <div class="info-line">
                <span class="label">Versions</span>
                <span class="value">26.2 - 1.21.11</span>
            </div>
            <div class="info-line">
                <span class="label">Server IP</span>
                <span class="value not-finished">not finished</span>
            </div>
        </div>
    </div>

</body>
</html>
