<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark SMP - Minecraft Server</title>

    <!-- Embed Meta Tags Corrigidas com seu Domínio Exato -->
    <meta property="og:title" content="Dark SMP - Minecraft Server" />
    <meta property="og:url" content="http://ddns.net" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ff0000"> <!-- Barra lateral vermelha no Discord -->

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Dark SMP">

    <style>
        /* Reset básico e tema escuro anti-queimar olhos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace; /* Fonte estilo terminal/Linux */
        }

        body {
            background-color: #0d0d11; /* Fundo super escuro */
            color: #ffffff;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        /* Layout normal da página */
        .container {
            width: 100%;
            max-width: 900px; /* Largura normal padrão para sites */
            background-color: #16161e;
            border: 2px solid #ff0000; /* Borda vermelha */
            border-radius: 12px; /* Cantos arredondados */
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        /* Barra superior estilo Linux (Sem botões) */
        .window-bar {
            background-color: #222230;
            padding: 14px 20px;
            border-bottom: 2px solid #ff0000;
        }

        .window-title {
            color: #a9b1d6;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Conteúdo interno com tamanho normalizado */
        .window-content {
            padding: 40px 30px;
        }

        /* Título Principal em Vermelho */
        .main-title {
            color: #ff0000;
            font-size: 2.8rem; /* Tamanho grande e normal para títulos */
            margin-bottom: 35px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Informações do Servidor ocupando o espaço corretamente */
        .info-box {
            background-color: #0d0d11;
            border-radius: 8px;
            padding: 25px;
            border: 1px solid #333;
        }

        .info-line {
            margin-bottom: 15px;
            font-size: 18px; /* Texto mais legível */
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-line:last-child {
            margin-bottom: 0;
        }

        .label {
            color: #ff0000; /* Marcadores em vermelho */
            font-weight: bold;
        }

        .value {
            color: #e0af68; /* Valores em amarelo/laranja estilo terminal */
        }
        
        .value.not-finished {
            color: #787c99;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Container do Site -->
    <div class="container">
        <div class="window-bar">
            <div class="window-title">root@dark-smp:~#</div>
        </div>

        <div class="window-content">
            <!-- Seu título vermelho -->
            <h1 class="main-title">Dark SMP - Minecraft Server</h1>

            <!-- Bloco de informações solicitado -->
            <div class="info-box">
                <div class="info-line">
                    <span class="label">> Supported Versions:</span>
                    <span class="value">26.2 - 1.21.11</span>
                </div>
                <div class="info-line">
                    <span class="label">> Server IP:</span>
                    <span class="value not-finished">not finished</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
