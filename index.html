<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark SMP - Minecraft Server</title>

    <!-- Ícone da aba (Bloco de Grama) -->
    <link rel="icon" type="image/x-icon" href="https://minecraftservices.com">

    <!-- Evitar cache para atualizar rápido -->
    <meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="expires" content="0" />

    <!-- Embed Meta Tags -->
    <meta property="og:title" content="Dark SMP - Minecraft Server" />
    <meta property="og:url" content="http://ddns.net" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ff0000">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Dark SMP">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            background-color: #06060a; 
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container 400x350px original */
        .container {
            width: 400px;
            height: 350px;
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            border: 1px solid rgba(255, 0, 50, 0.28);
            border-radius: 20px; 
            
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 45px 35px 40px 35px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.65),
                        0 0 50px rgba(255, 0, 50, 0.06);
        }

        /* Título Principal */
        .main-title {
            color: #ffffff;
            font-size: 2.2rem; 
            text-align: center;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
        }

        /* Painel de Informações */
        .info-box {
            display: flex;
            flex-direction: column;
            gap: 20px; 
            
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 1s ease, transform 1s ease;
        }

        /* Revela as informações após os dados carregarem */
        .info-box.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        .info-line {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            font-size: 15px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.06); 
            padding-bottom: 10px;
        }

        .info-line:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .label {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            letter-spacing: 0.8px;
        }

        .value {
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* IP clicável */
        .ip-click {
            color: #00ffcc;
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.2);
            font-size: 13px;
        }

        .ip-click:hover {
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        }

        /* Indicador de Status */
        .status-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #787c99; 
            transition: background-color 0.3s ease;
        }

        .status-online {
            background-color: #00ff66;
            box-shadow: 0 0 10px #00ff66;
            animation: pulse 1.8s infinite;
        }

        .status-offline {
            background-color: #ff334b;
            box-shadow: 0 0 10px #ff334b;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.5); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 255, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="main-title">Dark SMP</h1>

        <div class="info-box" id="infoBox">
            <div class="info-line">
                <span class="label">Versions</span>
                <span class="value">26.2 - 1.21.11</span>
            </div>

            <div class="info-line">
                <span class="label">Server IP</span>
                <span class="value ip-click" id="serverIp" onclick="copyIp()">nicely-kaufman.tun.ply.gg</span>
            </div>

            <div class="info-line">
                <span class="label">Status</span>
                <div class="status-wrapper">
                    <span class="status-dot" id="statusDot"></span>
                    <span class="value" id="playerCount">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ipOriginal = "nicely-kaufman.tun.ply.gg";

        function copyIp() {
            const ipTexto = document.getElementById("serverIp");
            navigator.clipboard.writeText(ipOriginal).then(() => {
                ipTexto.innerText = "COPIED!";
                ipTexto.style.color = "#ffffff";
                setTimeout(() => {
                    ipTexto.innerText = ipOriginal;
                    ipTexto.style.color = "#00ffcc";
                }, 2000);
            });
        }

        async function updateServerStatus() {
            const dot = document.getElementById("statusDot");
            const countText = document.getElementById("playerCount");

            try {
                // Nova rota focada estritamente na leitura do Query do servidor
                const response = await fetch(`https://mcsrvstat.us{ipOriginal}`);
                const data = await response.json();

                if (dot && countText) {
                    if (data && data.online === true) {
                        dot.className = "status-dot status-online";
                        
                        const onlinePlayers = data.players?.online ?? 0;
                        const maxPlayers = data.players?.max ?? 20;

                        countText.innerText = `${onlinePlayers} / ${maxPlayers} Players`;
                        countText.style.color = "#ffffff";
                    } else {
                        setOffline(dot, countText);
                    }
                }
            } catch (error) {
                setOffline(dot, countText);
            }
        }

        function setOffline(dot, countText) {
            if (countText) {
                countText.innerText = "OFFLINE";
                countText.style.color = "#ff334b";
            }
            if (dot) dot.className = "status-dot status-offline";
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateServerStatus();
            
            setTimeout(() => {
                const infoBox = document.getElementById('infoBox');
                if (infoBox) infoBox.classList.add('loaded');
            }, 600);
        });
    </script>
</body>
</html>
