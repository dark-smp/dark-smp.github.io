<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark SMP - Minecraft Server</title>

    <!-- Evitar cache para atualizar rápido -->
    <meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="expires" content="0" />

    <!-- Embed Meta Tags -->
    <meta property="og:title" content="Dark SMP - Minecraft Server" />
    <meta property="og:url" content="http://ddns.net" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ff0000">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Dark SMP">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            background-color: #06060a; 
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container 400x350px Aprovado */
        .container {
            width: 400px;
            height: 350px;
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            border: 1px solid rgba(255, 0, 50, 0.28);
            border-radius: 20px; 
            
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 45px 35px 40px 35px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.65),
                        0 0 50px rgba(255, 0, 50, 0.06);
        }

        /* Título Principal */
        .main-title {
            color: #ffffff;
            font-size: 2.2rem; 
            text-align: center;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
        }

        /* Painel de Informações */
        .info-box {
            display: flex;
            flex-direction: column;
            gap: 20px; 
        }

        .info-line {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            font-size: 15px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.06); 
            padding-bottom: 10px;
        }

        .info-line:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .label {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            letter-spacing: 0.8px;
        }

        .value {
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* IP em formato de botão clicável futurista */
        .ip-click {
            color: #00ffcc;
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.2);
            font-size: 13px; /* Um pouco menor para caber o IP longo do ply.gg */
        }

        .ip-click:hover {
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        }

        /* Indicador de Status com Ponto Pulsante */
        .status-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #787c99; /* Cor inicial cinza */
        }

        /* Animação de pulsação para o servidor Online */
        .status-online {
            background-color: #00ff66;
            box-shadow: 0 0 10px #00ff66;
            animation: pulse 1.8s infinite;
        }

        .status-offline {
            background-color: #ff334b;
            box-shadow: 0 0 10px #ff334b;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.5); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 255, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="main-title">Dark SMP</h1>

        <div class="info-box">
            <!-- Linha de Versões -->
            <div class="info-line">
                <span class="label">Versions</span>
                <span class="value">26.2 - 1.21.11</span>
            </div>

            <!-- Linha do Novo IP com clique para copiar -->
            <div class="info-line">
                <span class="label">Server IP</span>
                <span class="value ip-click" id="serverIp" onclick="copyIp()">nicely-kaufman.tun.ply.gg</span>
            </div>

            <!-- NOVO: Linha do Status e Contador de Jogadores -->
            <div class="info-line">
                <span class="label">Status</span>
                <div class="status-wrapper">
                    <span class="status-dot" id="statusDot"></span>
                    <span class="value" id="playerCount">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuração do seu IP do ply.gg
        const ipOriginal = "nicely-kaufman.tun.ply.gg";

        // Função para copiar o IP ao clicar na tela
        function copyIp() {
            const ipTexto = document.getElementById("serverIp");
            navigator.clipboard.writeText(ipOriginal).then(() => {
                ipTexto.innerText = "COPIED!";
                ipTexto.style.color = "#ffffff";
                
                // Volta o texto original depois de 2 segundos
                setTimeout(() => {
                    ipTexto.innerText = ipOriginal;
                    ipTexto.style.color = "#00ffcc";
                }, 2000);
            });
        }

        // Função futurista que busca os dados da API sem precisar de Query
        async function updateServerStatus() {
            try {
                const response = await fetch(`https://mcsrvstat.us{ipOriginal}`);
                const data = await response.json();
                
                const dot = document.getElementById("statusDot");
                const countText = document.getElementById("playerCount");

                if (data.online) {
                    dot.className = "status-dot status-online";
                    // Se tiver jogadores online mostra a quantia, senão mostra "Online" limpo
                    const onlinePlayers = data.players.online;
                    const maxPlayers = data.players.max;
                    countText.innerText = `${onlinePlayers} / ${maxPlayers} Players`;
                } else {
                    dot.className = "status-dot status-offline";
                    countText.innerText = "OFFLINE";
                    countText.style.color = "#ff334b";
                }
            } catch (error) {
                document.getElementById("playerCount").innerText = "ERROR";
            }
        }

        // Executa a checagem assim que a página abre
        updateServerStatus();
        // Atualiza o contador automaticamente a cada 30 segundos
        setInterval(updateServerStatus, 30000);
    </script>

</body>
</html>
