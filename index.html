<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark SMP - Minecraft Server</title>

    <!-- Evitar cache para atualizar rápido -->
    <meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="expires" content="0" />

    <!-- Embed Meta Tags -->
    <meta property="og:title" content="Dark SMP - Minecraft Server" />
    <meta property="og:url" content="http://ddns.net" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ff0000">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Dark SMP">

    <style>
        /* Reset e Fontes Modernas/Futuristas (Sem ser pixelada) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            background-color: #06060a; /* Fundo escuro absoluto e limpo */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Container 300x250 - Design Futurista de Vidro (Glassmorphism) */
        .container {
            width: 300px;
            height: 250px;
            background: rgba(255, 255, 255, 0.03); /* Vidro escuro translúcido */
            backdrop-filter: blur(10px); /* Efeito de desfoque no fundo */
            -webkit-backdrop-filter: blur(10px);
            
            /* Borda fina com degradê de luz suave, destacando o vermelho solicitado antes */
            border: 1px solid rgba(255, 0, 50, 0.25);
            border-radius: 16px; /* Curvas elegantes nos cantos */
            
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(255, 0, 50, 0.05); /* Brilho de presença bem sutil */
        }

        /* Título Principal Limpo e Elegante */
        .main-title {
            color: #ffffff;
            font-size: 1.4rem;
            text-align: center;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Painel de Informações Minimalista */
        .info-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .info-line {
            display: flex;
            justify-content: space-between; /* Alinha labels na esquerda e valores na direita */
            align-items: center;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); /* Linha divisória ultra fina */
            padding-bottom: 8px;
        }

        .info-line:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        /* Texto de identificação discreto */
        .label {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Valores com tipografia nítida e limpa */
        .value {
            color: #ffffff;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        /* IP não finalizado - Destaque em Vermelho Limpo */
        .value.not-finished {
            color: #ff334b;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Interface Futurista Minimalista (300x250) -->
    <div class="container">
        <!-- Título Clean -->
        <h1 class="main-title">Dark SMP</h1>

        <!-- Dados de Interface -->
        <div class="info-box">
            <div class="info-line">
                <span class="label">Versions</span>
                <span class="value">26.2 - 1.21.11</span>
            </div>
            <div class="info-line">
                <span class="label">Server IP</span>
                <span class="value not-finished">not finished</span>
            </div>
        </div>
    </div>

</body>
</html>
